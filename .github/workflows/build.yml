name: Build container

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "tesla_api_key/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/dnviti/tesla-api-key-homeassistant

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read add-on version
        id: addon
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib

          config = pathlib.Path("tesla_api_key/config.yaml").read_text()
          for line in config.splitlines():
              if line.startswith("version:"):
                  version = line.split(":", 1)[1].strip().strip("\"'")
                  print(f"version={version}")
                  break
          else:
              raise SystemExit("Could not find version in tesla_api_key/config.yaml")
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: ./tesla_api_key
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.addon.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.addon.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Tesla Fleet public key Home Assistant add-on
            org.opencontainers.image.version=${{ steps.addon.outputs.version }}
