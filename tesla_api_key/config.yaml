name: Tesla Fleet Public Key
version: "1.0.5"
slug: tesla_fleet_public_key
description: Serve the Tesla Fleet public key and proxy other requests to Home Assistant.
url: https://github.com/dnviti/tesla-api-key-homeassistant
image: ghcr.io/dnviti/tesla-api-key-homeassistant
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
options:
  key_pem: |
    -----BEGIN PUBLIC KEY-----
    paste-the-public-key-shown-by-home-assistant-here
    -----END PUBLIC KEY-----
  homeassistant_url: http://homeassistant.local.hass.io:8123
schema:
  key_pem: str
  homeassistant_url: str
