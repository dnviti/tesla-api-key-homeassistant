name: Tesla Fleet Public Key
version: "1.0.0"
slug: tesla_fleet_public_key
description: Serve the Tesla Fleet public key at the required well-known URL.
url: https://github.com/dnviti/tesla-api-key-homeassistant
image: ghcr.io/dnviti/tesla-api-key-homeassistant
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
init: false
ports:
  80/tcp: 8085
ports_description:
  80/tcp: Tesla Fleet public key HTTP endpoint
options:
  key_pem: ""
schema:
  key_pem: str
